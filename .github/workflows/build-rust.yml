---
name: Build Rust
run-name: ${{inputs.name}}-${{inputs.target}}

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        description: tool name
        default: lessi
        type: string
      upstream:
        required: true
        description: upstream repo
        default: roblillack/lessi
        type: string
      ref:
        required: true
        description: upstream repo ref
        default: cbd5c4206780a898489c85156e8178fe079d4a70
        type: string
      binary_name:
        required: true
        description: cli binary name
        default: lessi
        type: string
      target:
        required: true
        description: build target
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
      args:
        required: true
        description: rust build args
        default: --release --locked
        type: string
      runner:
        required: true
        description: build runner os
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest  # Arm64
          - macos-26-intel
          - macos-15-intel  # Intel
      cross:
        required: true
        description: cross compile
        default: true
        type: boolean
      release:
        required: true
        description: release name to upload to
        default: nightly
        type: string
      repo:
        required: true
        description: target repo (owner/name)
        # Must be a per-tool sub-repo, not this repo: this repo no longer
        # publishes releases, and uploader.py would happily create a
        # `nightly` release here from scratch.
        default: zydou/lessi-binary
        type: string


permissions: write-all
concurrency:
  group: ${{inputs.name}}-${{inputs.target}}-${{inputs.ref}}-${{inputs.release}}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      CARGO: cargo
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@main

      - name: Checkout upstream
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          path: upstream

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ inputs.target }}

      - name: Install Cross
        if: ${{ inputs.cross }}
        run: |
          # Download the pre-built cross binary instead of compiling from
          # source with `cargo install` (which takes ~5 min of build time).
          mkdir -p "$HOME/.cargo/bin"
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Set profile.release.strip = true
        shell: bash
        run: |
          mkdir -p $HOME/.cargo
          cat >> $HOME/.cargo/config.toml <<EOF
          [profile.release]
          strip = true
          opt-level = "z"
          lto = true
          codegen-units = 1
          panic = "abort"
          EOF

      # Per-tool customizations live in <tool>/patch.sh and run from inside the
      # upstream checkout. Each script documents why the tool needs it and fails
      # loudly — naming what drifted — if the customization no longer applies.
      # No-op for tools without one.
      #
      # The test must check <tool>/patch.sh directly: a hashFiles glob is
      # resolved at step start, after the upstream checkout, so it could match
      # an unrelated upstream/patch.sh and run the step for a tool that has
      # none.
      - name: Apply patch
        run: |
          if [ -f "${{ inputs.name }}/patch.sh" ]; then
            cd upstream
            bash "../${{ inputs.name }}/patch.sh"
          fi

      - name: Build release binary
        run: |-
          cd upstream
          rustup update
          eval "${{ env.CARGO }} build ${{ inputs.args }} --target ${{ inputs.target }}"

      - name: Upload ${{inputs.target}}
        env:
          # Use a PAT instead of the default GITHUB_TOKEN because the
          # upload target (zydou/<tool>-binary) is a different user-owned
          # repo, and the default token gets 403 on cross-repo writes.
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |-
          cd "$GITHUB_WORKSPACE/upstream/target/${{inputs.target}}/release"
          tar -cJf "${{inputs.name}}-${{inputs.target}}.tar.xz" "${{inputs.binary_name}}"
          mv "${{inputs.name}}-${{inputs.target}}.tar.xz" "$GITHUB_WORKSPACE/${{inputs.name}}-${{inputs.target}}.tar.xz"
          cd "$GITHUB_WORKSPACE"
          pip install requests
          python uploader.py \
            --name "${{inputs.name}}" \
            --target "${{inputs.target}}" \
            --ref "${{inputs.ref}}" \
            --upstream "${{inputs.upstream}}" \
            --repo "${{inputs.repo}}" \
            --release "${{inputs.release}}" \
            --path "${{inputs.name}}-${{inputs.target}}.tar.xz"
