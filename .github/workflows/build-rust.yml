---
name: Build Rust
run-name: ${{inputs.name}}-${{inputs.target}}

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        description: tool name
        default: bat
        type: string
      upstream:
        required: true
        description: upstream repo
        default: sharkdp/bat
        type: string
      ref:
        required: true
        description: upstream repo ref
        default: b4e3a84e1a6e68b2211bdebbbb0873f1d4aa2f8d
        type: string
      binary_name:
        required: true
        description: cli binary name
        default: bat
        type: string
      target:
        required: true
        description: build target
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
      args:
        required: true
        description: rust build args
        default: --release --locked
        type: string
      runner:
        required: true
        description: build runner os
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest  # Arm64
          - macos-26-intel
          - macos-15-intel  # Intel
      cross:
        required: true
        description: cross compile
        default: true
        type: boolean
      release:
        required: true
        description: release name to upload to
        default: nightly
        type: string
      repo:
        required: true
        description: target repo (owner/name)
        default: zydou/cli-tools
        type: string


permissions: write-all
concurrency:
  group: ${{inputs.name}}-${{inputs.target}}-${{inputs.ref}}-${{inputs.release}}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      CARGO: cargo
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@main

      - name: Checkout upstream
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          path: upstream

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ inputs.target }}

      - name: Install Cross
        if: ${{ inputs.cross }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cross
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Set profile.release.strip = true
        shell: bash
        run: |
          mkdir -p $HOME/.cargo
          cat >> $HOME/.cargo/config.toml <<EOF
          [profile.release]
          strip = true
          opt-level = "z"
          lto = true
          codegen-units = 1
          panic = "abort"
          EOF

      # https://github.com/sfackler/rust-openssl/issues/603
      - name: Apply openssl path
        if: inputs.name == 'hoard'
        run: |
          cd upstream
          git apply ../hoard/openssl.patch

      # tree-sitter >= 0.26 enables rquickjs's `bindgen` feature, which runs
      # bindgen+libclang at build time to generate QuickJS bindings.
      # bindgen >= 0.71 requires clang >= 9, but the cross-rs images
      # for x86_64-linux-gnu (clang 3.8), aarch64-linux-gnu (clang 3.8)
      # and aarch64-linux-musl (clang 6.0) ship older libclang that
      # lacks `clang_getTranslationUnitTargetInfo`, so the build fails.
      # Drop the `bindgen` feature so rquickjs uses its bundled,
      # pre-generated static bindings instead of generating them.
      #
      # Only applies to >= 0.26 (uses crates/generate/Cargo.toml); older
      # releases like 0.24.x use cli/generate/Cargo.toml without rquickjs,
      # so the patch does not apply there — skip it gracefully.
      #
      # `--locked` is omitted from tree-sitter's build_args (in build.json)
      # because upstream's Cargo.lock is frequently out of sync with
      # Cargo.toml on HEAD. Without --locked Cargo auto-updates the lock
      # file, which is required on native macOS runners (no cross Docker
      # image to paper over the mismatch).
      - name: Disable tree-sitter rquickjs bindgen
        if: inputs.name == 'tree-sitter'
        run: |
          cd upstream
          if [ -f crates/generate/Cargo.toml ]; then
            git apply ../tree-sitter/bindgen.patch
          else
            echo "Skipping bindgen.patch: crates/generate/Cargo.toml not found (old tree-sitter release)"
          fi

      # mdcat's `curl = "0.4.47"` declaration activates the curl crate's
      # default `ssl` feature, which pulls openssl-sys and needs the host's
      # libssl-dev headers. cross-rs Linux images don't ship dev headers, so
      # the build fails on every Linux target. Patch Cargo.toml to drop
      # the default feature and use static-curl + static-ssl + zlib-ng,
      # which vendors libcurl, OpenSSL and zlib into the binary. macOS
      # still works because curl-sys auto-activates force-system-lib-on-osx
      # on darwin.
      - name: Apply mdcat vendored curl patch
        if: inputs.name == 'mdcat'
        run: |
          cd upstream
          if git apply --check ../mdcat/vendored-curl.patch; then
            git apply ../mdcat/vendored-curl.patch
          else
            echo "::error::mdcat/vendored-curl.patch does not apply — upstream Cargo.toml's curl dep line changed. Re-generate the patch or drop it."
            exit 1
          fi

      # telemt's `plan.rs` unconditionally imports
      # `super::tcp_mss_runtime_profile`, but the function is gated
      # `#[cfg(any(target_os = "linux", test))]` in `listeners.rs`. The
      # call site in `plan.rs` is already `#[cfg(target_os = "linux")]`
      # with a no-op else branch, so the import is unused on non-Linux
      # targets and just needs the matching cfg gate. Without this,
      # macOS / Windows builds fail with E0432.
      - name: Apply telemt macOS cfg-import patch
        if: inputs.name == 'telemt'
        run: |
          cd upstream
          if git apply --check ../telemt/macos-cfg-import.patch; then
            git apply ../telemt/macos-cfg-import.patch
          else
            echo "::error::telemt/macos-cfg-import.patch does not apply — upstream plan.rs changed around the tcp_mss_runtime_profile import. Re-generate the patch or drop it."
            exit 1
          fi

      - name: Build release binary
        run: |-
          cd upstream
          rustup update
          eval "${{ env.CARGO }} build ${{ inputs.args }} --target ${{ inputs.target }}"

      - name: Upload ${{inputs.target}}
        env:
          # Use a PAT instead of the default GITHUB_TOKEN because the
          # upload target (zydou/<tool>-binary) is a different user-owned
          # repo, and the default token gets 403 on cross-repo writes.
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |-
          cd "$GITHUB_WORKSPACE/upstream/target/${{inputs.target}}/release"
          tar -cJf "${{inputs.name}}-${{inputs.target}}.tar.xz" "${{inputs.binary_name}}"
          mv "${{inputs.name}}-${{inputs.target}}.tar.xz" "$GITHUB_WORKSPACE/${{inputs.name}}-${{inputs.target}}.tar.xz"
          cd "$GITHUB_WORKSPACE"
          pip install requests
          python uploader.py \
            --name "${{inputs.name}}" \
            --target "${{inputs.target}}" \
            --ref "${{inputs.ref}}" \
            --upstream "${{inputs.upstream}}" \
            --repo "${{inputs.repo}}" \
            --release "${{inputs.release}}" \
            --path "${{inputs.name}}-${{inputs.target}}.tar.xz"
