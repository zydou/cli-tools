---
name: Build Go
run-name: ${{inputs.name}}-${{inputs.ref}}

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        description: tool name
        default: gopls
        type: string
      upstream:
        required: true
        description: upstream repo
        default: golang/tools
        type: string
      ref:
        required: true
        description: upstream ref (commit SHA)
        type: string
      goversion:
        required: true
        description: minimum go version
        default: ~1.18
        type: string
      ldflags:
        required: true
        description: go build ldflags
        default: -s -w
        type: string
      release:
        required: true
        description: release name to upload to
        default: nightly
        type: string
      repo:
        required: true
        description: target repo (owner/name)
        default: zydou/cli-tools
        type: string

permissions: write-all
concurrency:
  group: ${{inputs.name}}-${{inputs.ref}}-${{inputs.release}}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.name }} all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      # Checkout upstream at the requested ref
      # fetch-tags is only needed for tag releases (where GORELEASER_CURRENT_TAG
      # overrides tag detection anyway), but keeping it true is harmless.
      - name: checkout upstream
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          path: upstream
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: '${{ inputs.goversion }}'
          cache-dependency-path: upstream/go.sum

      - uses: goreleaser/goreleaser-action@master
        with:
          install-only: true

      - uses: actions/cache@main
        id: cache
        with:
          path: |
            ~/.local/bin/dasel
          key: ${{ runner.os }}-dasel

      - name: Install dasel
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -x "$HOME/.local/bin/dasel" ]; then
          mkdir -p "$HOME/.local/bin"
          curl -o "$HOME/.local/bin/dasel" -sSLf https://github.com/TomWright/dasel/releases/download/v2.5.0/dasel_linux_amd64
          chmod +x "$HOME/.local/bin/dasel"
          fi

      - name: generate .goreleaser.yaml
        run: |
          if [ -f "upstream/.goreleaser.yml" ]; then
          rm -f upstream/.goreleaser.yml
          fi
          # Use the .goreleaser.yaml from the tool directory in this repo
          # (e.g. gopls/.goreleaser.yaml) — not from the sub-repo.
          cp -f "${{inputs.name}}/.goreleaser.yaml" "upstream/.goreleaser.yaml"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.name}}" "project_name"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.name}}" "builds.[0].binary"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.ldflags}}" "builds.[0].ldflags"
          cat "upstream/.goreleaser.yaml"

      # Go cross-compiles all targets natively — one goreleaser run
      # produces linux-amd64, linux-arm64, darwin-amd64, darwin-arm64.
      #
      # For nightly builds, --auto-snapshot lets goreleaser generate a
      # snapshot version automatically (HEAD usually has no tag).
      # For tag releases, the upstream repo's git tag (e.g.
      # gopls/v0.23.0-pre.2) contains a slash and is not valid semver,
      # which breaks goreleaser's checksum file path. Set
      # GORELEASER_CURRENT_TAG to the normalized release name so
      # goreleaser uses a clean version instead of detecting the tag.
      #
      - name: build all targets
        run: |
          cd upstream
          if [ "${{inputs.release}}" = "nightly" ]; then
            goreleaser release --config ./.goreleaser.yaml --auto-snapshot --clean
          else
            # GORELEASER_CURRENT_TAG overrides the upstream tag detection
            # (e.g. gopls/v0.23.0-pre.2 has slashes that break the version).
            # --auto-snapshot enters snapshot mode when the repo is dirty
            # (which it always is, since we modify .goreleaser.yaml above).
            GORELEASER_CURRENT_TAG="${{inputs.release}}" \
            goreleaser release --config ./.goreleaser.yaml --auto-snapshot --clean
          fi

      - name: Upload all archives
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |-
          cd "$GITHUB_WORKSPACE"
          pip install requests
          for tarball in upstream/dist/*.tar.xz; do
            [ -e "$tarball" ] || { echo "::error::No archives found in upstream/dist/"; ls -la upstream/dist/; exit 1; }
            base=$(basename "$tarball" .tar.xz)
            target="${base#${{inputs.name}}-}"
            echo "Uploading $base (target: $target) to ${{inputs.repo}}/${{inputs.release}}"
            python uploader.py \
              --name "${{inputs.name}}" \
              --target "$target" \
              --ref "${{inputs.ref}}" \
              --upstream "${{inputs.upstream}}" \
              --repo "${{inputs.repo}}" \
              --release "${{inputs.release}}" \
              --path "$tarball"
          done
