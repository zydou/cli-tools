---
name: Build Go
run-name: ${{inputs.name}}-${{inputs.ref}}-${{inputs.target}}

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        description: tool name
        default: gopls
        type: string
      upstream:
        required: true
        description: upstream repo
        default: golang/tools
        type: string
      ref:
        required: true
        description: upstream ref
        type: string
      goversion:
        required: true
        description: minimum go version
        default: ~1.18
        type: string
      ldflags:
        required: true
        description: go build ldflags
        default: -s -w
        type: string
      target:
        required: true
        description: build target
        default: linux-amd64
        type: string
      release:
        required: true
        description: release name to upload to
        default: nightly
        type: string
      repo:
        required: true
        description: target repo (owner/name)
        default: zydou/cli-tools
        type: string

permissions: write-all
concurrency:
  group: ${{inputs.name}}-${{inputs.target}}-${{inputs.ref}}-${{inputs.release}}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.name }} ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      # Pull .goreleaser.yaml from the per-tool sub-repo (e.g. zydou/gopls-binary)
      - name: Checkout tool repo
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.repo }}
          path: tool-assets

      - name: checkout upstream
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          path: upstream
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: '${{ inputs.goversion }}'
          cache-dependency-path: upstream/go.sum

      - uses: goreleaser/goreleaser-action@master
        with:
          install-only: true

      - uses: actions/cache@main
        id: cache
        with:
          path: |
            ~/.local/bin/dasel
          key: ${{ runner.os }}-dasel

      - name: Install dasel
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -x "$HOME/.local/bin/dasel" ]; then
          mkdir -p "$HOME/.local/bin"
          curl -o "$HOME/.local/bin/dasel" -sSLf https://github.com/TomWright/dasel/releases/download/v2.5.0/dasel_linux_amd64
          chmod +x "$HOME/.local/bin/dasel"
          fi

      - name: generate .goreleaser.yaml
        run: |
          if [ -f "upstream/.goreleaser.yml" ]; then
          rm -f upstream/.goreleaser.yml
          fi
          cp -f "tool-assets/.goreleaser.yaml" "upstream/.goreleaser.yaml"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.name}}" "project_name"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.name}}" "builds.[0].binary"
          dasel put -f "upstream/.goreleaser.yaml" --value "${{inputs.ldflags}}" "builds.[0].ldflags"
          cat "upstream/.goreleaser.yaml"

      - name: build
        env:
          REMOTE_REF: ${{ inputs.ref }}
        run: |
          cd upstream
          case "${{ inputs.target }}" in
            linux-amd64)  GOOS=linux;  GOARCH=amd64 ;;
            linux-arm64)  GOOS=linux;  GOARCH=arm64 ;;
            darwin-amd64) GOOS=darwin; GOARCH=amd64 ;;
            darwin-arm64) GOOS=darwin; GOARCH=arm64 ;;
            *) echo "unknown target ${{ inputs.target }}"; exit 1 ;;
          esac
          echo "Building GOOS=$GOOS GOARCH=$GOARCH"
          GOOS="$GOOS" GOARCH="$GOARCH" goreleaser release \
            --config ./.goreleaser.yaml --auto-snapshot --clean --single-target
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "short_ref=${REMOTE_REF:0:7}" >> $GITHUB_ENV

      - name: Upload
        env:
          # Use a PAT instead of the default GITHUB_TOKEN because the
          # upload target (zydou/<tool>-binary) is a different user-owned
          # repo, and the default token gets 403 on cross-repo writes.
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |-
          cd "$GITHUB_WORKSPACE"
          pip install requests
          for tarball in upstream/dist/*.tar.xz; do
              [ -e "$tarball" ] || continue
              os_arch=$(basename "$tarball" .tar.xz)
              os_arch="${os_arch#${{inputs.name}}-}"
              python uploader.py \
                --name "${{inputs.name}}" \
                --target "$os_arch" \
                --ref "${{inputs.ref}}" \
                --upstream "${{inputs.upstream}}" \
                --repo "${{inputs.repo}}" \
                --release "${{inputs.release}}" \
                --path "$tarball"
          done
